name: Noodle Physics — GitHub Pages

on:
  push:
    branches:
      - preview/noodle-physics-sites
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noodle-physics-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build static preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Noodle Physics preview
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run physics regression suite
        run: npm test
      - name: Build Vite static assets
        run: npm run build
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish Noodle Physics preview
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
