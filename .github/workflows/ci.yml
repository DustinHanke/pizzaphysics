name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # On the isolated VPS-review branch, publish the static output as a ready-to-upload archive.
      - name: Package Noodle Physics for VPS
        if: github.ref == 'refs/heads/preview/noodle-physics-sites'
        run: cd dist && zip -q -r ../noodle-physics-vps.zip .
      - name: Upload VPS deployment package
        if: github.ref == 'refs/heads/preview/noodle-physics-sites'
        uses: actions/upload-artifact@v4
        with:
          name: noodle-physics-vps
          path: noodle-physics-vps.zip
          retention-days: 30
          if-no-files-found: error
